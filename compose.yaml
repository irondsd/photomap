name: photomap

services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      PHOTOMAP_ALLOWED_HOSTS: photomap.local,app.photomap.orb.local
      # Phone sync: the container can't see the Mac's wifi address, so set it in .env,
      # e.g. PHOTOMAP_SYNC_URL=http://192.168.1.20:4748
      PHOTOMAP_SYNC_URL: ${PHOTOMAP_SYNC_URL:-}
      # The default sync folder; another can be picked in Library → Phone sync, inside PHOTOMAP_SYNC_ROOT.
      PHOTOMAP_SYNC_DIR: "${PHOTOMAP_SYNC_DIR:-${HOME}/Pictures/Photomap Sync}"
      # So ~ in folder paths typed into the app means the Mac's home folder, not the container's.
      PHOTOMAP_HOME: ${HOME}
      PHOTOMAP_SYNC_NAME: ${PHOTOMAP_SYNC_NAME:-Photomap}
    labels:
      dev.orbstack.domains: photomap.local
      dev.orbstack.http-port: "4747"
    expose:
      - "4747"
    # The sync listener is the only port on the local network; it answers only paired phones.
    ports:
      - "4748:4748"
    volumes:
      # Mount the entire directory, including SQLite's WAL and SHM files.
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      # Where phone sync may write: the sync folder can be any folder in here. At the same absolute
      # path as on the Mac, so the index's paths stay valid. The library below stays read-only.
      - type: bind
        source: "${PHOTOMAP_SYNC_ROOT:-${HOME}/Pictures}"
        target: "${PHOTOMAP_SYNC_ROOT:-${HOME}/Pictures}"
        bind:
          create_host_path: false
      # Keep absolute paths identical to the paths already stored in SQLite.
      - type: bind
        source: "${PHOTOMAP_PHOTOS:-${HOME}/Pictures/My Photos}"
        target: "${PHOTOMAP_PHOTOS:-${HOME}/Pictures/My Photos}"
        read_only: true
        bind:
          create_host_path: false
